<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/binnacle-icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- WebView instrument tiles frame the App Launcher plugin's installed apps and admin-curated
         links: same-origin mounts need 'self', and launcher links may point at any http/https page. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' http: https:; form-action 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http: https:; connect-src 'self' http: https: ws: wss:; manifest-src 'self';"
    >
    <meta name="theme-color" content="#cfe0ec">
    <script src="/theme-bootstrap.js"></script>
    <meta name="description" content="A WebGL chartplotter for Signal K.">
    <title>Binnacle Custom Chartplotter</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
